<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Platform - Live Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="shortcut icon" href="./assets/icons/logo (2).png" type="image/x-icon">
</head>
<body>
    <!-- Top Global Navigation -->
    <header class="top-nav">
        <div class="nav-left">
            <button class="menu-btn" aria-label="Menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <h1 class="page-title">Support Platform - Live Chat</h1>
        </div>
        <div class="nav-right">
            <button class="profile-btn" aria-label="Profile">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </button>
        </div>
    </header>

    <!-- Main Chat Interface -->
    <main class="chat-layout">
        <div class="chat-container">
            
            <!-- Chat Header -->
            <div class="chat-header">
                <div class="chat-status-info">
                    <h2>Support Agent</h2>
                    <span class="status-indicator">Status: <span class="online-text">Online</span> <span class="dot"></span></span>
                </div>
                <button class="btn-primary create-ticket-btn">Create Support Ticket</button>
            </div>

            <!-- Scrollable Messages Area -->
            <div class="chat-messages" id="chat-messages">
                
                <!-- Customer Message -->
                <div class="message-group customer-group">
                    <span class="sender-name you">You</span>
                    <div class="message bubble customer">
                        Hello.
                    </div>
                    <span class="timestamp">10:41 AM</span>
                </div>

                <!-- Agent Message -->
                <div class="message-group agent-group">
                    <span class="sender-name">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 4px;"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        Agent
                    </span>
                    <div class="message bubble agent">
                        Hello! I'd be happy to help. What is the issue?
                    </div>
                    <span class="timestamp">10:42 AM</span>
                </div>

                <!-- Customer Message -->
                <div class="message-group customer-group">
                    <span class="sender-name you">You</span>
                    <div class="message bubble customer">
                        I can't see the 'Cancel' button.
                    </div>
                    <span class="timestamp">10:43 AM</span>
                </div>

                <!-- Typing Indicator -->
                <div class="typing-indicator">
                    Support is typing... <span class="dots"></span>
                </div>
            </div>

            <!-- Fixed Input Area -->
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Type your message here..." autocomplete="off">
                <button class="btn-primary send-btn" id="send-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    <span class="send-btn-text">SEND</span>
                </button>
            </div>

        </div>
    </main>
</body>
</html>
